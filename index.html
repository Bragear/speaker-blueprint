<!doctype html>
<html lang="en" data-style="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HULL MK I — exploded</title>
<meta name="description" content="A two-way speaker, taken apart as you scroll.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;900&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&family=Archivo:wght@400;500;600&family=Archivo+Black&family=Bangers&family=Courier+Prime:wght@400;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230d3777'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23eef3ff' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff5a3c'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
    "thinking-orbs/engine": "https://cdn.jsdelivr.net/npm/thinking-orbs@0.3.2/dist/engine.es.js",
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<svg class="grain" aria-hidden="true"><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter><rect width="100%" height="100%" filter="url(#grain)"/></svg>

<div class="sheet" aria-hidden="true">
  <div class="sheet-frame"></div>
  <div class="corner tl">A</div><div class="corner tr">1</div><div class="corner bl">2</div><div class="corner br">B</div>
</div>

<div class="halftone" aria-hidden="true"></div>
<div class="scan" aria-hidden="true"></div>
<canvas id="stage"></canvas>
<div class="crosshair" id="crosshair" aria-hidden="true"><i class="ch-v"></i><i class="ch-h"></i></div>
<p class="readout" id="readout" aria-hidden="true">X 0000 · Y 0000</p>
<div class="flash" id="flash" aria-hidden="true"></div>
<svg id="leaders" aria-hidden="true"></svg>
<div id="labels"></div>

<header class="opening" id="opening">
  <p class="eyebrow">DWG NO. 001 · TWO-WAY MONITOR</p>
  <h1 class="name">HULL<span>MK I</span></h1>
  <p class="cue"><span class="cue-line"></span>SCROLL TO DISASSEMBLE</p>
</header>

<aside class="detail" id="detail" hidden>
  <button class="detail-close" id="detail-close" aria-label="Close">×</button>
  <p class="detail-no"><span id="detail-no">1</span></p>
  <h2 class="detail-name" id="detail-name">GRILLE</h2>
  <dl class="detail-meta">
    <div><dt>MATERIAL</dt><dd id="detail-material">—</dd></div>
    <div><dt>DIMENSION</dt><dd id="detail-dim">—</dd></div>
  </dl>
  <p class="detail-fact" id="detail-fact"></p>
</aside>

<div class="player" id="player">
  <canvas class="orb" id="orb" aria-hidden="true"></canvas>
  <button class="play" id="play" type="button" aria-pressed="false" aria-label="Play music">
    <svg class="ic-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 1.5v9l8-4.5z"/></svg>
    <svg class="ic-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1.5h3v9H2zM7 1.5h3v9H7z"/></svg>
    <span class="play-label" id="play-label">Play</span>
  </button>
  <audio id="track" preload="none" loop>
    <source src="audio/track.mp3" type="audio/mpeg">
    <source src="audio/track.wav" type="audio/wav">
  </audio>
</div>
<aside class="bom" id="bom" aria-hidden="true">
  <div class="bom-head"><span>NO</span><span>PART</span><span>MATERIAL</span><span>QTY</span></div>
</aside>

<p class="hint" id="hint">DRAG TO ROTATE · TAP A PART</p>

<footer class="titleblock">
  <div class="tb-row"><span>TITLE</span><strong>HULL MK I · TWO-WAY MONITOR</strong></div>
  <div class="tb-grid">
    <div><span>SHEET</span><strong>1 OF 1</strong></div>
    <div><span>SCALE</span><strong>1 : 2</strong></div>
    <div class="rev" id="rev" title="Stamp a new style"><span>REV</span><strong><b id="rev-letter">A</b> <i id="rev-name">BLUEPRINT</i></strong></div>
    <div><span>DRAWN</span><strong>B. ARNTZEN</strong></div>
    <div><span>DATE</span><strong>29.10.2026</strong></div>
    <div><span>PARTS</span><strong id="tb-parts">0 / 8</strong></div>
  </div>
</footer>

<div class="scroller" id="scroller"></div>
<script type="module" src="main.js"></script>
</body>
</html>
